<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KickSlot · Booking preview</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 54rem; margin: 2rem auto; padding: 0 1rem; color: #163b32; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
    form label { display: grid; }
    input, select, button { padding: .4rem; font: inherit; }
    button { cursor: pointer; }
    li { margin-block: .6rem; }
    [role="status"] { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>KickSlot</h1>
    <label>Demo account
      <select id="actor"></select>
    </label>
    <p>Seeded hours are 17:00–21:00 every day. Grass starts at €20/hour and indoor at €30/hour.</p>
    <section id="player"></section>
    <section id="admin" hidden>
      <h2>Bookings I manage</h2>
      <label>Booking <select id="managed"></select></label>
      <button id="confirm">Confirm</button>
      <button id="reject">Reject</button>
      <p id="admin-result" role="status"></p>
      <div id="venues"></div>
      <div id="pitch-form"></div>
    </section>
    <section id="inbox"></section>
  </main>
  <script type="module" src="./a2.js"></script>
</body>
</html>
